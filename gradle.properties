org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Minecraft / NeoForge
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.21.2)
neo_version=21.1.259
loader_version_range=[4,)

# Mod identity. Everything a rename touches lives in this block - see the
# rename checklist in README.md.
mod_id=pseudocore_curios
mod_name=Pseudocore Curios
mod_license=GNU Lesser General Public License v2.1
mod_version=1.0.0-alpha.1
mod_group_id=org.bitwisemadness.pseudocore.curios
mod_authors=Bitwise Madness
mod_description=A Curios slot for Pseudocore cores: keep a core on your belt, press a key to release its stored mob at your position, and press it again to recall that mob through the normal capture gates. Also ships the Pseudocore ecosystem's Tensura data - Gear Evolution chains covering every core tier.

# The single source of truth for the version. ci.yml reads this line, and
# version-bump.yml rewrites it. Never hardcode the version anywhere else.

# Dependency pins. Pseudocore resolves from its GitHub Packages maven (alphas
# are GitHub-only there); the *_file_id values are CurseMaven coordinates, the
# same scheme the org's other mod repos use.
pseudocore_version=2.1.1-alpha.4
curios_file_id=6529130
gearevolution_file_id=9122235
tensura_file_id=8793360
manascore_file_id=8022425
architectury_file_id=8492726
cloth_config_file_id=5729127
geckolib_file_id=8893490
smartbrainlib_file_id=7055149
