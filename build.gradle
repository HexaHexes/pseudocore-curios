plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'com.github.spotbugs' version '6.5.12'
    id 'com.diffplug.spotless' version '8.10.3'
}

version = mod_version
group = mod_group_id

base {
    // Keep in sync with rootProject.name in settings.gradle and mod_id in
    // gradle.properties. The shipped jar is <archivesName>-<version>.jar.
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

// Game tests live in their own source set: they compile against main, and are
// deliberately NOT part of sourceSets.main - so none of it is packaged into the
// released jar. Declared before neoForge because the mods block below joins it.
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output + configurations.compileClasspath
        runtimeClasspath += output + sourceSets.main.output + configurations.runtimeClasspath
    }
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }

        // Headless test runner. NeoForge's patched server Main boots a
        // GameTestServer that runs every registered @GameTest and exits - no
        // window, no live instance. This is the only verification gate.
        gameTestServer {
            type = "gameTestServer"
            gameDirectory = project.layout.projectDirectory.dir('run')
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            // The gametest source set joins the mod for the dev runs so
            // @GameTestHolder is discovered from FML's scan data. It is still
            // not in the jar - the jar only packages sourceSets.main.
            sourceSet sourceSets.gametest
        }
    }
}

// Expand the ${...} placeholders in src/main/templates into the real
// neoforge.mods.toml at build time, so mod identity is edited in one place
// (gradle.properties) rather than duplicated in the toml.
def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            pseudocore_version     : pseudocore_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}
// Feed the generated metadata in as a resource dir; passing the task provider
// wires the dependency so the toml is generated before resources are processed.
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// JUnit suite: the CI junit check grades it and refuses to pass on an empty
// run, so this configuration must stay wired in every derived repo.
repositories {
    // CurseMaven - resolves mod jars by CurseForge project + file id. Curios
    // and the Tensura/Gear Evolution closure come from here, so a clean
    // checkout (and CI) resolves every jar without a local folder.
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
    // Pseudocore resolves from its own GitHub Packages maven: it is not on
    // CurseForge or Modrinth (alphas are GitHub-only by its release policy),
    // and it publishes there on every release. GH Packages reads require
    // credentials: the workflow token in CI, gpr.user / gpr.key locally.
    maven {
        name = 'GitHubPackages'
        url = uri('https://maven.pkg.github.com/HexaHexes/pseudocore')
        credentials {
            username = System.getenv('GITHUB_ACTOR') ?: project.findProperty('gpr.user')
            password = System.getenv('GITHUB_TOKEN') ?: project.findProperty('gpr.key')
        }
    }
    mavenCentral()
}

configurations {
    // Runtime closure for the GameTest run: staged into run/mods by
    // prepareGametestMods, exactly like the rest of the org's mod repos.
    gametestMods
}

dependencies {
    // The mod this addon is built on: the slot logic calls releaseContained,
    // tryCapture and TensuraBridge. Never bundled.
    compileOnly "org.bitwisemadness.pseudocore:pseudocore:${pseudocore_version}"
    // The slot this mod adds. Never bundled.
    compileOnly "curse.maven:curios-309927:${curios_file_id}"
    // Gear Evolution and Tensura, for the retention suite that drives GE's
    // own reconciliation over a filled core (#2). Tensura is all rights
    // reserved: compile only, never bundled.
    compileOnly "curse.maven:gearevolution-1501711:${gearevolution_file_id}"
    compileOnly "curse.maven:tensura-reincarnated-643695:${tensura_file_id}"
    compileOnly "curse.maven:architectury-419699:${architectury_file_id}"

    // For the run-only mods folder: Pseudocore from GitHub Packages, Curios
    // from CurseMaven - the smoke test needs both present so the mod's own
    // required dependencies resolve at FML load. The Tensura/Gear Evolution
    // closure mirrors tensura-tool-belt's, so the retention suite runs against
    // the pack's real evolution stack.
    gametestMods "org.bitwisemadness.pseudocore:pseudocore:${pseudocore_version}"
    gametestMods "curse.maven:curios-309927:${curios_file_id}"
    gametestMods "curse.maven:gearevolution-1501711:${gearevolution_file_id}"
    gametestMods "curse.maven:architectury-419699:${architectury_file_id}"
    gametestMods "curse.maven:cloth-config-348521:${cloth_config_file_id}"
    gametestMods "curse.maven:geckolib-388172:${geckolib_file_id}"
    // The core jar nests every manascore-* module under META-INF/jars; FML's
    // nested-jar loader installs them at runtime, so only the core is staged.
    gametestMods "curse.maven:manascore-619025:${manascore_file_id}"
    gametestMods "curse.maven:smartbrainlib-661293:${smartbrainlib_file_id}"
    gametestMods "curse.maven:tensura-reincarnated-643695:${tensura_file_id}"
    gametestMods "curse.maven:terrablender-940057:${terrablender_file_id}"

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // The chain data is JSON; Minecraft supplies Gson at runtime, the plain
    // JUnit classpath does not. Same version Minecraft ships.
    testImplementation 'com.google.code.gson:gson:2.10.1'
    // Logging runs through slf4j, which Minecraft supplies at runtime but
    // which is not on the plain JUnit classpath.
    testImplementation 'org.slf4j:slf4j-api:2.0.13'
}

test {
    useJUnitPlatform()
}

// --- GameTest harness -------------------------------------------------------

// Grade the run on the log summary, not the exit code: the GameTestServer prints
// "All N required tests passed :)" when every required test succeeds. Keep
// expectedTests in sync with the @GameTest methods in src/gametest.
// Stage the pack's dependency mod jars into the run's production-style mods/
// folder, where FML's mods-folder locator finds them exactly like in the pack.
tasks.register('prepareGametestMods', Sync) {
    from configurations.gametestMods
    into 'run/mods'
}

tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    dependsOn 'prepareGametestMods'

    def expectedTests = 6
    doLast {
        def log = file('run/logs/latest.log')
        if (!log.exists()) {
            throw new GradleException("GameTest produced no log at ${log}")
        }
        def text = log.text
        def problems = []
        def passMatcher = (text =~ /All (\d+) required tests passed/)
        if (passMatcher.find()) {
            def passed = passMatcher.group(1) as int
            if (passed != expectedTests) {
                problems << "only ${passed}/${expectedTests} tests passed"
            }
        } else if ((text =~ /\d+ required tests failed/).find()) {
            problems << 'GameTest reported failed tests'
        } else {
            problems << 'no GameTest summary found in log'
        }
        if (text.contains('Encountered an unexpected exception')) {
            problems << 'server crashed during tests'
        }
        if (problems) {
            throw new GradleException("GameTest failed: ${problems.join('; ')} - see ${log}")
        }
        logger.lifecycle("GameTest OK: all ${expectedTests} tests passed")
    }
}

// --- Publishing -------------------------------------------------------------

// Every repo in the org publishes its artifact to the org's GitHub Packages
// Maven registry for alpha, beta and stable releases (see agents/AGENTS.md):
// release.yml cuts the GitHub release, publish.yml runs on "release published"
// and drives this block. Credentials come from the workflow token in CI; a
// local publish can supply gpr.user / gpr.key in ~/.gradle/gradle.properties.
// Keep the URL pointing at THIS repository - the rename checklist covers it.
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
            artifactId = mod_id
            pom {
                name = mod_name
                description = mod_description
                licenses {
                    license {
                        name = mod_license
                    }
                }
            }
        }
    }
    repositories {
        maven {
            name = 'GitHubPackages'
            url = uri('https://maven.pkg.github.com/HexaHexes/pseudocore-curios')
            credentials {
                username = System.getenv('GITHUB_ACTOR') ?: project.findProperty('gpr.user')
                password = System.getenv('GITHUB_TOKEN') ?: project.findProperty('gpr.key')
            }
        }
    }
}

// --- Static analysis (report-only grace period) ----------------------------
// Both tools run as the `static` CI job. During the grace period neither can
// block a build: SpotBugs findings are recorded but never fail the task, and
// Spotless is detached from `check` (enforceCheck false) so the junit job's
// `./gradlew build` stays style-agnostic. Gating flips on in a follow-up once
// the finding volume is known; that follow-up also runs one spotlessApply per
// repo to clear the baseline.
spotbugs {
    ignoreFailures = true
    effort = com.github.spotbugs.snom.Effort.MAX
}

spotbugsTest {
    enabled = false
}

spotbugsMain {
    // HTML report into build/reports/spotbugs for the CI artifact upload.
    reports {
        html.required = true
        xml.required = false
    }
}

spotless {
    enforceCheck false
    java {
        // Minimal profile only: no formatter, so no repo-wide rewrites.
        // Trailing whitespace, final newline, deterministic import order.
        target 'src/*/java/**/*.java'
        trimTrailingWhitespace()
        endWithNewline()
        importOrder()
    }
}
