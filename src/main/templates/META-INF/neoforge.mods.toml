# Mod metadata file. Values written in dollar-brace form are replaced at build
# time from gradle.properties (see generateModMetadata in build.gradle), so mod
# identity is edited in one place only.
# See https://docs.neoforged.net/docs/concepts/modfiles/ for the full schema.

modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

[modproperties.${mod_id}]
# Optional: background texture for this mod's Configured config screen (see the
# In-game config editing section of README.md). Any existing texture works.
configuredBackground = "minecraft:textures/block/stone.png"

[[mixins]]
config = "${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neo_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# The slot and the release/recall keybind are the mod; neither works without
# Pseudocore (cores, releaseContained, TensuraBridge) or Curios (the slot).
[[dependencies.${mod_id}]]
modId = "pseudocore"
type = "required"
# Deliberately a literal floor, not the pseudocore_version substitution:
# Maven orders 2.2.0-alpha.2 BELOW 2.2.0, so a substituted floor refuses
# the alpha train the pack runs (#77) - the floor is the first sound
# build of the 2.2.0 line (alpha.1 bricked clients, pseudocore#168) and
# admits the rest of the train, stable 2.2.0 and everything above.
versionRange = "[2.2.0-alpha.2,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "curios"
type = "required"
versionRange = "[9,)"
ordering = "AFTER"
side = "BOTH"

# Ability Core - required: the press definition, handler and availability
# projection are this mod's core seam and nothing gates them (unlike the
# bar below). Floor = alpha.39, the first build with the 9-arg
# AbilityDefinition constructor this bridge calls (#88's recorded
# migration); CI compiles and gates against alpha.42.
[[dependencies.${mod_id}]]
modId = "ability_core"
type = "required"
# alpha.01 of the 1.0.2 line is the floor: it is where the mastery
# contract (REQ-CORE-12, core#137) ships, and press's declaration and
# award sites call into it. The floor also fails loudly: a pack on a
# pre-1.0.2 core gets a dependency error naming this mod instead of a
# NoSuchMethodError at RegisterEvent (the 2026-11-06 crash class).
versionRange = "[1.0.2-alpha.01,)"
ordering = "AFTER"
side = "BOTH"

# Ability Hotbar - optional: the curios bar. Every call site is gated on
# CuriosBarBridge.isLoaded() (the register and seed events), so the mod
# runs without it. Floor = alpha.50, the first build with the
# supplier-less registerContentBar this bridge calls (the alpha.50
# reshape, hotbar#120's resolution); 47-49 carry only the removed
# supplier shape and would crash this call. CI and the pack gate
# against alpha.53.
[[dependencies.${mod_id}]]
modId = "ability_hotbar"
type = "optional"
versionRange = "[1.0.0-alpha.50,)"
ordering = "AFTER"
side = "BOTH"

# The compat legs - every one presence-gated (ModList.isLoaded) in its own
# integration class, so the mod runs with none of them installed.
[[dependencies.${mod_id}]]
modId = "corpse"
type = "optional"
versionRange = "[1.1.22,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "iceandfire"
type = "optional"
versionRange = "[2.0-beta.15,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "xaerominimap"
type = "optional"
versionRange = "[26.6.0,)"
ordering = "AFTER"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "gearevolution"
type = "optional"
versionRange = "[1,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "tensura"
type = "optional"
versionRange = "[2.0.1.3,)"
ordering = "AFTER"
side = "BOTH"
